<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Uni Registration Form</title>
</head>

<body>
  <h2 align="center">University Registration Form 2026–2027</h2>

  <form>
    <fieldset>
      <legend>Personal Info</legend>

      <label>Full name:</label>
      <input type="text" placeholder="Enter your name" />

      <label>Nationality:</label>
      <input type="text" placeholder="Enter your nationality" />

      <label>Date of Birth:</label>
      <input type="date" />

      <label>Gender:</label>
      <label> <input type="radio" value="male" /> Male </label>
      <label> <input type="radio" value="female" /> Female </label>

      <br />
      <br />

      <label>Resident No:</label>
      <input type="number" />

      <label>Phone Number:</label>
      <input type="tel" />

      <label>Email Address:</label>
      <input type="email" />

      <label>Full Name (Parent):</label>
      <input type="text" />

      <label>Phone Number (Parent):</label>
      <input type="tel" />
    </fieldset>

    <fieldset>
      <legend>Capabilities</legend>

      <label>Type of High School:</label>
      <select>
        <option value="type1">Type 1</option>
        <option value="type2">Type 2</option>
      </select>

      <label>Percentage:</label>
      <input type="number" />

      <label>Got it in:</label>
      <input type="date" />

      <label>Where you got it:</label>
      <input type="text" />

      <label>High School Certificate Photo:</label>
      <input type="file" />

      <br />
      <br />

      <label>Where you want to get into:</label>
      <select>
        <optgroup label="Medicine">
          <option value="doctor">Doctor</option>
          <option value="nurse">Nurse</option>
        </optgroup>
        <optgroup label="Computers">
          <option value="it">IT</option>
          <option value="cyber">Cybersecurity</option>
        </optgroup>
      </select>

      <label>Notes:</label>
      <textarea rows="3" cols="50" placeholder="Your notes"></textarea>

      <br />
      <br />

      <input type="submit" value="Submit Registration" />
    </fieldset>
  </form>
</body>

</html>
