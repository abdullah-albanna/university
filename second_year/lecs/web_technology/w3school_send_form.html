<html>
  <body>
    <form action="https://api.w3school.com/example" method="get">
      <fieldset>
        <h2>This form sends an e-mail to w3school</h2>

        <label for="name">Name: </label>
        <br />
        <input id="name" type="text" placeholder="your username" />

        <br />
        <label for="mail">Mail: </label>
        <br />
        <input id="mail" type="email" placeholder="your email" />

        <br />
        <label for="comments">Comments: </label>
        <br />
        <input
          width="200"
          id="comments"
          type="text"
          placeholder="your comments"
        />
        <br />

        <input type="submit" value="Send" />
        <input type="reset" value="Reset" />
      </fieldset>
    </form>
  </body>
</html>
